[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-hive-mcp"
version = "0.1.4"
description = "Local-first memory your AI agents share over MCP. Agents propose; only you confirm."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Memory Hive" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "memory", "ai-memory", "local-first", "privacy", "ai-agents", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://hello-fengchao.com"
Repository = "https://github.com/330899935/memory-hive-mcp"
"App (macOS)" = "https://apps.apple.com/app/id6806992983"
Source = "https://github.com/330899935/memory-hive-mcp"
Changelog = "https://github.com/330899935/memory-hive-mcp/blob/main/CHANGELOG.md"

[project.scripts]
memory-hive-mcp = "hive_mcp.stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

# tools.json is the single source of truth for the tool surface and is read at
# runtime, so it MUST ship inside the wheel. Without this, an installed copy
# raises FileNotFoundError on the first tools/list — the package would look
# broken on exactly the machines that never ran it from a source checkout.
[tool.setuptools.package-data]
hive_mcp = ["tools.json"]
