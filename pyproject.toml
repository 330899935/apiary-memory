[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apiary-memory"
version = "0.2.0"
description = "Local-first memory your AI agents share over MCP. Ships a working SQLite memory store; agents propose, only you confirm."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Apiary" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "memory", "ai-memory", "local-first", "privacy", "ai-agents", "claude", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://hello-fengchao.com"
Repository = "https://github.com/330899935/apiary-memory"
"App (macOS)" = "https://apps.apple.com/app/id6806992983"
Source = "https://github.com/330899935/apiary-memory"
Changelog = "https://github.com/330899935/apiary-memory/blob/main/CHANGELOG.md"

# The distribution was renamed from memory-hive-mcp in 0.2.0. Both entry points
# are installed and both resolve to the same function: an MCP host config that
# already names `memory-hive-mcp` keeps working, and a new one can say
# `apiary-memory`. Dropping the old names would break every config written
# before the rename.
[project.scripts]
apiary-memory = "hive_mcp.stdio:main"
# Confirming a proposal is a human action, so it gets its own command and is
# deliberately absent from the MCP tool surface.
apiary-memory-cli = "hive_mcp.cli:main"
memory-hive-mcp = "hive_mcp.stdio:main"
memory-hive-mcp-cli = "hive_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# tools.json is the single source of truth for the tool surface and is read at
# runtime, so it MUST ship inside the wheel. Without this, an installed copy
# raises FileNotFoundError on the first tools/list — the package would look
# broken on exactly the machines that never ran it from a source checkout.
[tool.setuptools.package-data]
hive_mcp = ["tools.json"]
